[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metabase-export"
version = "0.1.0"
description = "Export Metabase questions to a tree of .sql files that mirrors the collection tree"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "georgegiosue", email = "peraldonamoc@gmail.com" }]
keywords = ["metabase", "sql", "export", "version-control", "analytics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: Utilities",
]
dependencies = ["psycopg[binary]>=3.1"]

[project.urls]
Homepage = "https://github.com/georgegiosue/metabase-export"
Issues = "https://github.com/georgegiosue/metabase-export/issues"

[project.scripts]
metabase-export = "metabase_export.cli:main"

[dependency-groups]
dev = ["pytest>=8"]
